name: Build AWG 3.1 tools APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'package/amneziawg-tools/**'
      - 'scripts/build-awg3-tools-apk.sh'
      - '.github/workflows/build-awg3-tools.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenWrt SDK prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3-setuptools \
            rsync swig unzip zlib1g-dev file wget zstd

      - name: Build and verify custom AWG 3.1 tools APK
        env:
          REPO_DIR: ${{ github.workspace }}
          WORK: ${{ runner.temp }}/friendlywrt-awg3-tools-apk
          SDK_ARCHIVE: ${{ runner.temp }}/openwrt-sdk-25.12.2-rockchip-armv8.tar.zst
        run: |
          chmod +x scripts/build-awg3-tools-apk.sh
          scripts/build-awg3-tools-apk.sh | tee "$RUNNER_TEMP/awg3-tools-build.log"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: friendlywrt-awg3-tools-aarch64
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/friendlywrt-awg3-tools-apk/output/*.apk
            ${{ runner.temp }}/friendlywrt-awg3-tools-apk/output/*.sha256
            ${{ runner.temp }}/friendlywrt-awg3-tools-apk/output/*.json
            ${{ runner.temp }}/awg3-tools-build.log
